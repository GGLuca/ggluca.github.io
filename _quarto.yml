project:
  type: website
  
lang: ro

execute:
  freeze: auto   # codul R rulează doar când se schimbă postarea

date-format: "D MMMM YYYY"

website:
  title: "George Gunnesch-Luca"
  site-url: https://ggluca.ro
  repo-url: https://github.com/GGLuca/ggluca.github.io
  favicon: images/favicon.png         # generat de _favicon.R
  open-graph: true                     # carduri la share (WhatsApp, LinkedIn, Facebook)
  twitter-card: true                   # carduri la share (X, Bluesky, Slack)
  repo-actions: [edit, issue]          # "Edit this page / Report an issue" in the footer
  navbar:
    right:
      - href: blog.qmd
        text: Blog
      - href: workshops.qmd
        text: Workshopuri
      - href: aplicatii.qmd
        text: Aplicații
      - href: cercetare.qmd
        text: Cercetare
      - href: software.qmd
        text: Software
      - icon: rss
        href: blog.xml
      - icon: github
        href: https://github.com/GGLuca
  page-footer:
    center: "Construit cu Quarto."

format:
  html:
    theme:
      light: [cosmo, custom.css, hokusai-light.scss]
      dark: [darkly, custom.css, hokusai-dark.scss]                     # supplying both adds the light/dark toggle
    toc: false